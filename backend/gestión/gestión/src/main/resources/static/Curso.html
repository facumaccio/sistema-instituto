<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #28a745; color: white; }
        .form-container { margin-top: 20px; margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Gestión de Cursos</h1>
    <a href="index.html" style="margin-bottom: 20px; display: inline-block;">Volver a Inscripciones</a>
    
    <div class="form-container">
        <h3 id="titulo-formulario">Nuevo Curso</h3>
        <form id="form-curso">
            <input type="hidden" id="curso-id">
            
            <label>Nombre del Idioma: <input type="text" id="nombre" placeholder="Ej: Alemán"></label>
            <label style="margin-left: 10px;">Turno: <input type="text" id="turno" placeholder="Ej: Mañana"></label>
            
            <button type="button" id="btn-guardar" onclick="guardarCurso()" style="margin-left: 10px; background-color: #28a745;">Guardar</button>
            <button type="button" id="btn-cancelar" onclick="cancelarEdicion()" style="margin-left: 5px; background-color: #6c757d; display: none;">Cancelar</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Turno</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
        </tbody>
    </table>

    <script>
        window.onload = cargarCursos;

        function cargarCursos() {
            fetch('http://localhost:8080/api/cursos')
                .then(response => response.json())
                .then(data => {
                    let cuerpoTabla = document.getElementById('cuerpo-tabla');
                    cuerpoTabla.innerHTML = '';

                    data.forEach(curso => {
                        let turno = curso.turno ? curso.turno : '-';
                        let fila = `<tr>
                            <td>${curso.id}</td>
                            <td>${curso.nombre}</td>
                            <td>${turno}</td>
                            <td>
                                <button onclick="prepararEdicion(${curso.id}, '${curso.nombre}', '${turno}')" style="background-color: #ffc107; color: black; padding: 5px 10px; margin-right: 5px;">Editar</button>
                                <button onclick="eliminarCurso(${curso.id})" style="background-color: #dc3545; padding: 5px 10px;">Borrar</button>
                            </td>
                        </tr>`;
                        cuerpoTabla.innerHTML += fila;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function prepararEdicion(id, nombre, turno) {
            document.getElementById('curso-id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('turno').value = turno !== '-' ? turno : '';
            
            document.getElementById('titulo-formulario').innerText = "Modificar Curso ID: " + id;
            document.getElementById('btn-guardar').innerText = "Actualizar";
            document.getElementById('btn-cancelar').style.display = "inline-block";
        }

        function cancelarEdicion() {
            document.getElementById('form-curso').reset();
            document.getElementById('curso-id').value = '';
            document.getElementById('titulo-formulario').innerText = "Nuevo Curso";
            document.getElementById('btn-guardar').innerText = "Guardar";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        function guardarCurso() {
            let idValor = document.getElementById('curso-id').value;
            let nombreValor = document.getElementById('nombre').value;
            let turnoValor = document.getElementById('turno').value;

            if (nombreValor.trim() === '') {
                alert('Error: El nombre del curso es obligatorio.');
                return; 
            }

            let cursoData = { nombre: nombreValor, turno: turnoValor };
            let url = 'http://localhost:8080/api/cursos';
            let metodo = 'POST';

            if (idValor !== '') {
                url = url + '/' + idValor;
                metodo = 'PUT';
            }

            fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cursoData)
            })
            .then(response => {
                if(response.ok) {
                    alert('¡Operación exitosa!');
                    cancelarEdicion(); 
                    cargarCursos(); 
                } else {
                    alert('Error al guardar el curso.');
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function eliminarCurso(id) {
            if (!confirm('¿Estás seguro de que querés eliminar el curso con ID ' + id + '?')) return; 

            fetch('http://localhost:8080/api/cursos/' + id, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    alert('Curso eliminado correctamente');
                    cargarCursos(); 
                } else {
                    alert('Error al eliminar. ¿Quizás tiene alumnos inscriptos?');
                }
            })
            .catch(error => console.error('Error al eliminar:', error));
        }
    </script>
</body>
</html>
