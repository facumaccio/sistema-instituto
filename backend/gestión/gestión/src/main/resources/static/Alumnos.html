<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alumnos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>Lista de Alumnos</h1>
    <!-- Menú simple para navegar -->
    <a href="index.html" style="margin-bottom: 20px; display: inline-block;">Volver a Inscripciones</a>
    <br>
    <button onclick="cargarAlumnos()">Cargar Alumnos</button>

    <div style="margin-top: 20px; margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 5px;">
        <h3>Nuevo Alumno</h3>
        <form id="form-alumno">
            <label>Nombre y Apellido: <input type="text" id="nya"></label>
            <label style="margin-left: 10px;">DNI: <input type="text" id="dni"></label>
            <button type="button" onclick="crearAlumno()" style="margin-left: 10px; background-color: #28a745;">Guardar</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre y Apellido</th>
                <th>DNI</th>
                <th>Acciones</th> <!-- Columna agregada -->
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
        </tbody>
    </table>

    <script>
        function cargarAlumnos() {
            fetch('http://localhost:8080/api/alumnos')
                .then(response => response.json())
                .then(data => {
                    let cuerpoTabla = document.getElementById('cuerpo-tabla');
                    cuerpoTabla.innerHTML = '';

                    data.forEach(alumno => {
                        // Fila actualizada con el botón de borrar
                        let fila = `<tr>
                            <td>${alumno.id}</td>
                            <td>${alumno.nya}</td>
                            <td>${alumno.dni}</td>
                            <td>
                                <button onclick="eliminarAlumno(${alumno.id})" style="background-color: #dc3545; padding: 5px 10px;">Borrar</button>
                            </td>
                        </tr>`;
                        cuerpoTabla.innerHTML += fila;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function crearAlumno() {
            let nyaValor = document.getElementById('nya').value;
            let dniValor = document.getElementById('dni').value;

            // 1. Validación de campos vacíos
            if (nyaValor.trim() === '' || dniValor.trim() === '') {
                alert('Error: Por favor, completá tanto el Nombre como el DNI.');
                return; 
            }

            // 2. Validación de comas
            if (dniValor.includes(',')) {
                alert('Error: Ingrese correctamente el DNI (use puntos o solo números, sin comas).');
                return;
            }

            // 3. Le sacamos todos los puntos al DNI ingresado
            let dniLimpio = dniValor.replace(/\./g, '');

            // 4. Validación de formato
            if (!/^\d{7,8}$/.test(dniLimpio)) {
                alert('Error: El DNI debe ser un número válido de 7 u 8 cifras.');
                return;
            }

            // Armamos el objeto
            let nuevoAlumno = {
                nya: nyaValor,
                dni: dniLimpio 
            };

            fetch('http://localhost:8080/api/alumnos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoAlumno)
            })
            .then(response => response.json())
            .then(data => {
                alert('¡Alumno creado con ID: ' + data.id + '!');
                document.getElementById('form-alumno').reset(); 
                cargarAlumnos(); 
            })
            .catch(error => console.error('Error:', error));
        }

        // Función nueva para eliminar
        function eliminarAlumno(id) {
            if (!confirm('¿Estás seguro de que querés eliminar el alumno con ID ' + id + '?')) {
                return; 
            }

            fetch('http://localhost:8080/api/alumnos/' + id, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert('Alumno eliminado correctamente');
                    cargarAlumnos(); 
                } else {
                    alert('Error al eliminar. ¿Quizás tiene una inscripción asociada?');
                }
            })
            .catch(error => console.error('Error al eliminar:', error));
        }
    </script>

</body>
</html>
