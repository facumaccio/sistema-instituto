spring.application.name=database-institute
spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.xjfqixsubfpstmnbjgpq
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Permite que el frontend muestre los mensajes de error enviados por la API.
server.error.include-message=always

# Evita que el navegador use versiones viejas de HTML, CSS y JS.
spring.web.resources.cache.cachecontrol.no-cache=true

# Configuración SMTP para Gmail.
# Definí MAIL_USERNAME y MAIL_PASSWORD en el entorno (Gmail requiere una
# contraseña de aplicación, no la contraseña normal de la cuenta).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000